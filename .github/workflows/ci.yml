name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ide-workdir-browser-code

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ide-workdir-browser-code/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run check

      - name: Build production bundles
        run: npm run build
        env:
          APP_UPDATE_REPOSITORY: ${{ github.repository }}
