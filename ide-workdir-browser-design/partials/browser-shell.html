<!-- BEGIN browser-shell.html -->
<!-- Shared: sidebar, toolbar, content frame, inspector frame, statusbar -->
<!-- Insert into project-shell SLOT:shell-content -->

<!-- Sidebar -->
<aside id="browser-sidebar" data-region="sidebar" data-slot="sidebar-state" class="flex w-[var(--sidebar-width)] shrink-0 flex-col border-r border-border bg-sidebar/80 backdrop-blur-md">
  <div class="flex items-center justify-between px-3 py-2">
    <span class="text-caption font-semibold uppercase tracking-wide text-muted-foreground">IDE</span>
    <button data-dom-id="btn-toggle-sidebar" class="rounded p-1 text-muted-foreground hover:bg-accent hover:text-accent-foreground" title="收起边栏">
      <i data-lucide="panel-left" class="h-4 w-4"></i>
    </button>
  </div>
  <nav class="flex-1 overflow-y-auto px-2 pb-2" aria-label="IDE 列表">
    <ul class="space-y-0.5">
      <li>
        <button data-dom-id="nav-ide-codex" data-ide="codex" data-slot="active-ide" data-active="true" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
          <i data-lucide="box" class="h-4 w-4 shrink-0"></i>
          <span class="truncate">Codex</span>
          <span class="ml-auto text-mono-sm opacity-70">~/.codex</span>
        </button>
      </li>
      <li>
        <button data-dom-id="nav-ide-claude" data-ide="claude" data-slot="active-ide" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
          <i data-lucide="message-square" class="h-4 w-4 shrink-0"></i>
          <span class="truncate">Claude Code</span>
          <span class="ml-auto text-mono-sm opacity-70">~/.claude</span>
        </button>
      </li>
      <li>
        <button data-dom-id="nav-ide-trae" data-ide="trae" data-slot="active-ide" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
          <i data-lucide="zap" class="h-4 w-4 shrink-0"></i>
          <span class="truncate">Trae</span>
          <span class="ml-auto text-mono-sm opacity-70">~/.trae-cn</span>
        </button>
      </li>
      <li>
        <button data-dom-id="nav-ide-cursor" data-ide="cursor" data-slot="active-ide" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
          <i data-lucide="sparkles" class="h-4 w-4 shrink-0"></i>
          <span class="truncate">Cursor</span>
          <span class="ml-auto text-mono-sm opacity-70">~/.cursor</span>
        </button>
      </li>
      <li>
        <button data-dom-id="nav-ide-zed" data-ide="zed" data-slot="active-ide" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
          <i data-lucide="bolt" class="h-4 w-4 shrink-0"></i>
          <span class="truncate">Zed</span>
          <span class="ml-auto text-mono-sm opacity-70">~/.zed</span>
        </button>
      </li>
      <li>
        <button data-dom-id="nav-ide-vscode" data-ide="vscode" data-slot="active-ide" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
          <i data-lucide="braces" class="h-4 w-4 shrink-0"></i>
          <span class="truncate">VS Code</span>
          <span class="ml-auto text-mono-sm opacity-70">~/.vscode</span>
        </button>
      </li>
    </ul>
  </nav>
  <div class="border-t border-border p-2">
    <button data-dom-id="btn-settings" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-muted-foreground hover:bg-accent hover:text-accent-foreground">
      <i data-lucide="settings" class="h-4 w-4 shrink-0"></i>
      <span>设置</span>
    </button>
  </div>
</aside>

<!-- Main area -->
<div class="flex min-w-0 flex-1 flex-col bg-background">
  <!-- Toolbar -->
  <header data-region="toolbar" class="flex h-[var(--toolbar-height)] shrink-0 items-center gap-2 border-b border-border bg-toolbar px-3">
    <div class="flex items-center gap-1">
      <button data-dom-id="btn-nav-back" class="rounded p-1 text-muted-foreground hover:bg-accent hover:text-accent-foreground" title="后退">
        <i data-lucide="chevron-left" class="h-4 w-4"></i>
      </button>
      <button data-dom-id="btn-nav-forward" class="rounded p-1 text-muted-foreground hover:bg-accent hover:text-accent-foreground" title="前进">
        <i data-lucide="chevron-right" class="h-4 w-4"></i>
      </button>
    </div>

    <!-- View switcher -->
    <div class="flex items-center rounded-md border border-border bg-muted p-0.5">
      <button data-dom-id="view-icon" data-view="icon" class="rounded px-2 py-0.5 text-caption text-muted-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-background data-[active=true]:text-foreground data-[active=true]:shadow-sm" title="图标视图">
        <i data-lucide="layout-grid" class="h-4 w-4"></i>
      </button>
      <button data-dom-id="view-list" data-view="list" class="rounded px-2 py-0.5 text-caption text-muted-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-background data-[active=true]:text-foreground data-[active=true]:shadow-sm" title="列表视图">
        <i data-lucide="list" class="h-4 w-4"></i>
      </button>
      <button data-dom-id="view-column" data-view="column" class="rounded px-2 py-0.5 text-caption text-muted-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-background data-[active=true]:text-foreground data-[active=true]:shadow-sm" title="分栏视图">
        <i data-lucide="columns-3" class="h-4 w-4"></i>
      </button>
    </div>

    <!-- Breadcrumb -->
    <nav data-region="breadcrumb" data-slot="breadcrumb-path" class="flex min-w-0 flex-1 items-center gap-1 overflow-hidden text-body">
      <button class="truncate rounded px-1 py-0.5 text-muted-foreground hover:bg-accent hover:text-accent-foreground">Codex</button>
      <i data-lucide="chevron-right" class="h-3.5 w-3.5 shrink-0 text-muted-foreground"></i>
      <button class="truncate rounded px-1 py-0.5 text-muted-foreground hover:bg-accent hover:text-accent-foreground">projects</button>
      <i data-lucide="chevron-right" class="h-3.5 w-3.5 shrink-0 text-muted-foreground"></i>
      <span class="truncate font-medium text-foreground">my-app</span>
    </nav>

    <!-- Search -->
    <div class="relative hidden md:block">
      <i data-lucide="search" class="pointer-events-none absolute left-2 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-muted-foreground"></i>
      <input data-dom-id="toolbar-search" type="search" placeholder="搜索" class="h-7 w-40 rounded-md border border-border bg-background pl-7 pr-2 text-body text-foreground placeholder:text-muted-foreground focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" />
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-1">
      <button data-dom-id="btn-stats" class="rounded p-1 text-muted-foreground hover:bg-accent hover:text-accent-foreground" title="统计">
        <i data-lucide="bar-chart-2" class="h-4 w-4"></i>
      </button>
      <button data-dom-id="btn-refresh" class="rounded p-1 text-muted-foreground hover:bg-accent hover:text-accent-foreground" title="刷新">
        <i data-lucide="refresh-cw" class="h-4 w-4"></i>
      </button>
    </div>
  </header>

  <!-- Workspace: content + inspector -->
  <div class="flex flex-1 min-h-0 overflow-hidden">
    <!-- Content area -->
    <main id="content-area" data-region="content" data-slot="content-view" class="flex min-w-[var(--content-min)] flex-1 flex-col overflow-auto bg-background p-4">
      <!-- SLOT:content-view -->
    </main>

    <!-- Inspector panel -->
    <aside id="inspector-panel" data-region="inspector" class="flex w-[var(--inspector-width)] shrink-0 flex-col border-l border-border bg-sidebar/60 shadow-panel backdrop-blur-md">
      <div class="flex h-8 shrink-0 items-center border-b border-border px-3">
        <span class="text-caption font-medium text-muted-foreground">预览与信息</span>
      </div>
      <div data-slot="inspector-content" class="flex-1 overflow-y-auto p-4">
        <!-- SLOT:inspector-content -->
      </div>
    </aside>
  </div>

  <!-- Status bar -->
  <footer data-region="statusbar" class="flex h-[var(--statusbar-height)] shrink-0 items-center justify-between border-t border-border bg-toolbar px-3 text-caption text-muted-foreground">
    <div data-slot="statusbar-info" class="flex items-center gap-3 truncate">
      <span>12 个项目</span>
      <span>128 MB</span>
    </div>
    <div class="flex items-center gap-3">
      <button data-dom-id="btn-zoom-out" class="hover:text-foreground"><i data-lucide="zoom-out" class="h-3 w-3"></i></button>
      <span data-slot="zoom-level" class="tabular-nums">100%</span>
      <button data-dom-id="btn-zoom-in" class="hover:text-foreground"><i data-lucide="zoom-in" class="h-3 w-3"></i></button>
    </div>
  </footer>
</div>

<!-- END browser-shell.html -->
