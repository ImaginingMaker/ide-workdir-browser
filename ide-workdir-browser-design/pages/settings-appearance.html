<body class="min-h-screen font-sans antialiased">
    <div id="app-window" class="relative flex flex-col w-full min-h-screen overflow-hidden rounded-xl shadow-[0_1.5rem_3.75rem_rgba(0,0,0,0.25)] bg-background text-foreground" style="font-family: var(--font-sans);">
      <!-- Title bar / drag region -->
      <div data-region="titlebar" class="app-region-drag flex h-11 shrink-0 items-center justify-between border-b border-border bg-sidebar/80 px-4 backdrop-blur-md">
        <div class="flex items-center gap-2">
          <span class="inline-block h-3 w-3 rounded-full" style="background-color: var(--traffic-red);"></span>
          <span class="inline-block h-3 w-3 rounded-full" style="background-color: var(--traffic-yellow);"></span>
          <span class="inline-block h-3 w-3 rounded-full" style="background-color: var(--traffic-green);"></span>
        </div>
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-caption text-muted-foreground" data-slot="window-title">IDE 工作目录浏览器</div>
        <div class="w-16"></div>
      </div>

      <!-- App body: settings shell -->
      <div id="app-body" class="flex flex-1 overflow-hidden">
        <!-- Settings sidebar -->
        <aside id="settings-sidebar" data-region="settings-sidebar" class="flex w-[var(--sidebar-width)] shrink-0 flex-col border-r border-border bg-sidebar/80 backdrop-blur-md">
          <div class="flex h-11 shrink-0 items-center border-b border-border px-4">
            <span class="text-heading">设置</span>
          </div>
          <nav class="flex-1 overflow-y-auto px-3 py-2" aria-label="设置分类">
            <ul class="space-y-0.5">
              <li>
                <button data-dom-id="settings-tab-ide" data-tab="ide" data-slot="settings-tab" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
                  <i data-lucide="box" class="h-4 w-4 shrink-0"></i>
                  <span>IDE 管理</span>
                </button>
              </li>
              <li>
                <button data-dom-id="settings-tab-appearance" data-tab="appearance" data-slot="settings-tab" data-active="true" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
                  <i data-lucide="palette" class="h-4 w-4 shrink-0"></i>
                  <span>外观</span>
                </button>
              </li>
              <li>
                <button data-dom-id="settings-tab-advanced" data-tab="advanced" data-slot="settings-tab" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
                  <i data-lucide="sliders-horizontal" class="h-4 w-4 shrink-0"></i>
                  <span>高级</span>
                </button>
              </li>
              <li>
                <button data-dom-id="settings-tab-about" data-tab="about" data-slot="settings-tab" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
                  <i data-lucide="info" class="h-4 w-4 shrink-0"></i>
                  <span>关于</span>
                </button>
              </li>
            </ul>
          </nav>
          <div class="border-t border-border p-3">
            <button data-dom-id="btn-back-to-browser" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-muted-foreground hover:bg-accent hover:text-accent-foreground">
              <i data-lucide="arrow-left" class="h-4 w-4 shrink-0"></i>
              <span>返回浏览器</span>
            </button>
          </div>
        </aside>

        <!-- Settings form area -->
        <div class="flex min-w-0 flex-1 flex-col bg-background">
          <div class="flex h-11 shrink-0 items-center border-b border-border bg-toolbar px-4">
            <span data-slot="settings-tab" class="text-heading">外观</span>
          </div>
          <main data-region="settings-form" data-slot="settings-form" class="flex-1 overflow-y-auto p-6">
            <section class="mx-auto max-w-2xl space-y-6">
              <div>
                <h2 class="text-heading font-semibold text-foreground">外观设置</h2>
                <p class="mt-1 text-body text-muted-foreground">自定义应用的主题、颜色、缩放与字体大小。</p>
              </div>

              <!-- Theme -->
              <div class="rounded-lg border border-border bg-card p-4">
                <label class="block text-body font-medium text-foreground">主题</label>
                <p class="mb-3 text-caption text-muted-foreground">选择应用使用的颜色模式。</p>
                <div class="grid grid-cols-3 gap-2">
                  <label class="cursor-pointer rounded-md border border-border bg-background p-3 text-center hover:bg-secondary has-[:checked]:border-primary has-[:checked]:bg-primary/5">
                    <input type="radio" name="theme" value="light" class="sr-only" checked />
                    <i data-lucide="sun" class="mx-auto mb-1 h-5 w-5 text-foreground"></i>
                    <span class="block text-caption text-foreground">浅色</span>
                  </label>
                  <label class="cursor-pointer rounded-md border border-border bg-background p-3 text-center hover:bg-secondary has-[:checked]:border-primary has-[:checked]:bg-primary/5">
                    <input type="radio" name="theme" value="dark" class="sr-only" />
                    <i data-lucide="moon" class="mx-auto mb-1 h-5 w-5 text-foreground"></i>
                    <span class="block text-caption text-foreground">深色</span>
                  </label>
                  <label class="cursor-pointer rounded-md border border-border bg-background p-3 text-center hover:bg-secondary has-[:checked]:border-primary has-[:checked]:bg-primary/5">
                    <input type="radio" name="theme" value="auto" class="sr-only" />
                    <i data-lucide="monitor" class="mx-auto mb-1 h-5 w-5 text-foreground"></i>
                    <span class="block text-caption text-foreground">自动</span>
                  </label>
                </div>
              </div>

              <!-- Accent color -->
              <div class="rounded-lg border border-border bg-card p-4">
                <label class="block text-body font-medium text-foreground">强调色</label>
                <p class="mb-3 text-caption text-muted-foreground">选择按钮、链接与活动状态使用的强调色。</p>
                <div class="flex items-center gap-3">
                  <label class="cursor-pointer">
                    <input type="radio" name="accent" value="blue" class="sr-only peer" checked />
                    <span class="block h-8 w-8 rounded-full bg-[#007aff] ring-2 ring-transparent peer-checked:ring-foreground"></span>
                  </label>
                  <label class="cursor-pointer">
                    <input type="radio" name="accent" value="green" class="sr-only peer" />
                    <span class="block h-8 w-8 rounded-full bg-[#34c759] ring-2 ring-transparent peer-checked:ring-foreground"></span>
                  </label>
                  <label class="cursor-pointer">
                    <input type="radio" name="accent" value="orange" class="sr-only peer" />
                    <span class="block h-8 w-8 rounded-full bg-[#ff9500] ring-2 ring-transparent peer-checked:ring-foreground"></span>
                  </label>
                  <label class="cursor-pointer">
                    <input type="radio" name="accent" value="purple" class="sr-only peer" />
                    <span class="block h-8 w-8 rounded-full bg-[#af52de] ring-2 ring-transparent peer-checked:ring-foreground"></span>
                  </label>
                  <label class="cursor-pointer">
                    <input type="radio" name="accent" value="red" class="sr-only peer" />
                    <span class="block h-8 w-8 rounded-full bg-[#ff3b30] ring-2 ring-transparent peer-checked:ring-foreground"></span>
                  </label>
                </div>
              </div>

              <!-- Zoom slider -->
              <div class="rounded-lg border border-border bg-card p-4">
                <div class="flex items-center justify-between">
                  <label for="zoom-level" class="block text-body font-medium text-foreground">界面缩放</label>
                  <span id="zoom-value" class="text-caption text-muted-foreground">100%</span>
                </div>
                <p class="mb-3 text-caption text-muted-foreground">调整整个界面的显示比例。</p>
                <input id="zoom-level" type="range" min="75" max="150" value="100" class="w-full accent-primary" />
                <div class="mt-1 flex justify-between text-caption text-muted-foreground">
                  <span>75%</span>
                  <span>150%</span>
                </div>
              </div>

              <!-- Font size -->
              <div class="flex items-center justify-between rounded-lg border border-border bg-card p-4">
                <div>
                  <label for="font-size" class="block text-body font-medium text-foreground">字体大小</label>
                  <p class="text-caption text-muted-foreground">设置内容区域与侧边栏的字体尺寸。</p>
                </div>
                <select id="font-size" class="rounded-md border border-input bg-background px-3 py-1.5 text-body text-foreground outline-none focus:border-ring focus:ring-1 focus:ring-ring">
                  <option value="small">小</option>
                  <option value="medium" selected>中</option>
                  <option value="large">大</option>
                  <option value="xlarge">特大</option>
                </select>
              </div>

              <!-- Show hidden files -->
              <label class="flex cursor-pointer items-center justify-between rounded-lg border border-border bg-card p-4">
                <div>
                  <span class="block text-body font-medium text-foreground">显示隐藏文件</span>
                  <span class="text-caption text-muted-foreground">在浏览器中显示以点开头的文件和文件夹。</span>
                </div>
                <span class="relative inline-flex h-5 w-9 cursor-pointer rounded-full bg-input transition peer-checked:bg-primary">
                  <input type="checkbox" class="peer sr-only" />
                  <span class="absolute left-0.5 top-0.5 h-4 w-4 rounded-full bg-background transition peer-checked:translate-x-4"></span>
                </span>
              </label>
            </section>
          </main>
        </div>
      </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
