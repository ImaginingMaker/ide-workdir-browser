<body class="min-h-screen font-sans antialiased">
    <div id="app-window" class="relative flex flex-col w-full min-h-screen overflow-hidden rounded-xl shadow-[0_1.5rem_3.75rem_rgba(0,0,0,0.25)] bg-background text-foreground" style="font-family: var(--font-sans);">
      <!-- Title bar / drag region -->
      <div data-region="titlebar" class="app-region-drag flex h-11 shrink-0 items-center justify-between border-b border-border bg-sidebar/80 px-4 backdrop-blur-md">
        <div class="flex items-center gap-2">
          <span class="inline-block h-3 w-3 rounded-full" style="background-color: var(--traffic-red);"></span>
          <span class="inline-block h-3 w-3 rounded-full" style="background-color: var(--traffic-yellow);"></span>
          <span class="inline-block h-3 w-3 rounded-full" style="background-color: var(--traffic-green);"></span>
        </div>
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-caption text-muted-foreground" data-slot="window-title">IDE 工作目录浏览器</div>
        <div class="w-16"></div>
      </div>

      <!-- App body: settings shell -->
      <div id="app-body" class="flex flex-1 overflow-hidden">
        <!-- Settings sidebar -->
        <aside id="settings-sidebar" data-region="settings-sidebar" class="flex w-[var(--sidebar-width)] shrink-0 flex-col border-r border-border bg-sidebar/80 backdrop-blur-md">
          <div class="flex h-11 shrink-0 items-center border-b border-border px-4">
            <span class="text-heading">设置</span>
          </div>
          <nav class="flex-1 overflow-y-auto px-3 py-2" aria-label="设置分类">
            <ul class="space-y-0.5">
              <li>
                <button data-dom-id="settings-tab-ide" data-tab="ide" data-slot="settings-tab" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
                  <i data-lucide="box" class="h-4 w-4 shrink-0"></i>
                  <span>IDE 管理</span>
                </button>
              </li>
              <li>
                <button data-dom-id="settings-tab-appearance" data-tab="appearance" data-slot="settings-tab" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
                  <i data-lucide="palette" class="h-4 w-4 shrink-0"></i>
                  <span>外观</span>
                </button>
              </li>
              <li>
                <button data-dom-id="settings-tab-advanced" data-tab="advanced" data-slot="settings-tab" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
                  <i data-lucide="sliders-horizontal" class="h-4 w-4 shrink-0"></i>
                  <span>高级</span>
                </button>
              </li>
              <li>
                <button data-dom-id="settings-tab-about" data-tab="about" data-slot="settings-tab" data-active="true" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
                  <i data-lucide="info" class="h-4 w-4 shrink-0"></i>
                  <span>关于</span>
                </button>
              </li>
            </ul>
          </nav>
          <div class="border-t border-border p-3">
            <button data-dom-id="btn-back-to-browser" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-muted-foreground hover:bg-accent hover:text-accent-foreground">
              <i data-lucide="arrow-left" class="h-4 w-4 shrink-0"></i>
              <span>返回浏览器</span>
            </button>
          </div>
        </aside>

        <!-- Settings form area -->
        <div class="flex min-w-0 flex-1 flex-col bg-background">
          <div class="flex h-11 shrink-0 items-center border-b border-border bg-toolbar px-4">
            <span data-slot="settings-tab" class="text-heading">关于</span>
          </div>
          <main data-region="settings-form" data-slot="settings-form" class="flex-1 overflow-y-auto p-6">
            <section class="mx-auto max-w-2xl space-y-6">
              <!-- App identity -->
              <div class="flex items-center gap-4 rounded-lg border border-border bg-card p-5">
                <div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-xl bg-secondary">
                  <i data-lucide="folder-open" class="h-8 w-8 text-primary"></i>
                </div>
                <div>
                  <h2 class="text-heading font-semibold text-foreground">IDE 工作目录浏览器</h2>
                  <p class="text-body text-muted-foreground">版本 1.0.0 (Build 1000)</p>
                  <p class="mt-1 text-caption text-muted-foreground">© 2026 IDE Workdir Browser Team. 保留所有权利。</p>
                </div>
              </div>

              <!-- Actions -->
              <div class="flex flex-wrap items-center gap-2">
                <button type="button" class="inline-flex items-center gap-1.5 rounded-md bg-primary px-3 py-1.5 text-body font-medium text-primary-foreground hover:bg-primary/90">
                  <i data-lucide="download" class="h-4 w-4"></i>
                  <span>检查更新</span>
                </button>
                <a href="#" class="inline-flex items-center gap-1.5 rounded-md border border-border bg-background px-3 py-1.5 text-body text-foreground hover:bg-secondary">
                  <i data-lucide="file-text" class="h-4 w-4"></i>
                  <span>开源许可证</span>
                </a>
              </div>

              <!-- Shortcuts -->
              <div class="rounded-lg border border-border bg-card p-4">
                <h3 class="mb-3 text-body font-semibold text-foreground">键盘快捷键</h3>
                <dl class="space-y-2">
                  <div class="flex items-center justify-between">
                    <dt class="text-body text-foreground">聚焦搜索</dt>
                    <dd class="flex items-center gap-1"><kbd class="rounded border border-border bg-secondary px-1.5 py-0.5 text-caption font-mono text-foreground">⌘</kbd><kbd class="rounded border border-border bg-secondary px-1.5 py-0.5 text-caption font-mono text-foreground">K</kbd></dd>
                  </div>
                  <div class="flex items-center justify-between">
                    <dt class="text-body text-foreground">切换视图模式</dt>
                    <dd class="flex items-center gap-1"><kbd class="rounded border border-border bg-secondary px-1.5 py-0.5 text-caption font-mono text-foreground">⌘</kbd><kbd class="rounded border border-border bg-secondary px-1.5 py-0.5 text-caption font-mono text-foreground">1</kbd><kbd class="rounded border border-border bg-secondary px-1.5 py-0.5 text-caption font-mono text-foreground">2</kbd><kbd class="rounded border border-border bg-secondary px-1.5 py-0.5 text-caption font-mono text-foreground">3</kbd></dd>
                  </div>
                  <div class="flex items-center justify-between">
                    <dt class="text-body text-foreground">刷新目录</dt>
                    <dd class="flex items-center gap-1"><kbd class="rounded border border-border bg-secondary px-1.5 py-0.5 text-caption font-mono text-foreground">⌘</kbd><kbd class="rounded border border-border bg-secondary px-1.5 py-0.5 text-caption font-mono text-foreground">R</kbd></dd>
                  </div>
                  <div class="flex items-center justify-between">
                    <dt class="text-body text-foreground">显示/隐藏隐藏文件</dt>
                    <dd class="flex items-center gap-1"><kbd class="rounded border border-border bg-secondary px-1.5 py-0.5 text-caption font-mono text-foreground">⇧</kbd><kbd class="rounded border border-border bg-secondary px-1.5 py-0.5 text-caption font-mono text-foreground">⌘</kbd><kbd class="rounded border border-border bg-secondary px-1.5 py-0.5 text-caption font-mono text-foreground">.</kbd></dd>
                  </div>
                  <div class="flex items-center justify-between">
                    <dt class="text-body text-foreground">打开设置</dt>
                    <dd class="flex items-center gap-1"><kbd class="rounded border border-border bg-secondary px-1.5 py-0.5 text-caption font-mono text-foreground">⌘</kbd><kbd class="rounded border border-border bg-secondary px-1.5 py-0.5 text-caption font-mono text-foreground">,</kbd></dd>
                  </div>
                  <div class="flex items-center justify-between">
                    <dt class="text-body text-foreground">打开/关闭检查器</dt>
                    <dd class="flex items-center gap-1"><kbd class="rounded border border-border bg-secondary px-1.5 py-0.5 text-caption font-mono text-foreground">⌘</kbd><kbd class="rounded border border-border bg-secondary px-1.5 py-0.5 text-caption font-mono text-foreground">I</kbd></dd>
                  </div>
                </dl>
              </div>

              <!-- Credits -->
