<body class="min-h-screen font-sans antialiased">
    <div id="app-window" class="relative flex flex-col w-full min-h-screen overflow-hidden rounded-xl shadow-[0_1.5rem_3.75rem_rgba(0,0,0,0.25)] bg-background text-foreground" style="font-family: var(--font-sans);">
      <!-- Title bar / drag region -->
      <div data-region="titlebar" class="app-region-drag flex h-11 shrink-0 items-center justify-between border-b border-border bg-sidebar/80 px-4 backdrop-blur-md">
        <!-- Traffic lights -->
        <div class="flex items-center gap-2">
          <span class="inline-block h-3 w-3 rounded-full" style="background-color: var(--traffic-red);"></span>
          <span class="inline-block h-3 w-3 rounded-full" style="background-color: var(--traffic-yellow);"></span>
          <span class="inline-block h-3 w-3 rounded-full" style="background-color: var(--traffic-green);"></span>
        </div>
        <!-- Window title (centered, draggable) -->
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-caption text-muted-foreground" data-slot="window-title">IDE 工作目录浏览器</div>
        <!-- Right spacer -->
        <div class="w-16"></div>
      </div>

      <!-- App body: settings shell -->
      <div id="app-body" class="flex flex-1 overflow-hidden">
        <!-- Settings sidebar -->
        <aside id="settings-sidebar" data-region="settings-sidebar" class="flex w-[var(--sidebar-width)] shrink-0 flex-col border-r border-border bg-sidebar/80 backdrop-blur-md">
          <div class="flex h-11 shrink-0 items-center border-b border-border px-4">
            <span class="text-heading">设置</span>
          </div>
          <nav class="flex-1 overflow-y-auto px-3 py-2" aria-label="设置分类">
            <ul class="space-y-0.5">
              <li>
                <button data-dom-id="settings-tab-ide" data-tab="ide" data-slot="settings-tab" data-active="true" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
                  <i data-lucide="box" class="h-4 w-4 shrink-0"></i>
                  <span>IDE 管理</span>
                </button>
              </li>
              <li>
                <button data-dom-id="settings-tab-appearance" data-tab="appearance" data-slot="settings-tab" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
                  <i data-lucide="palette" class="h-4 w-4 shrink-0"></i>
                  <span>外观</span>
                </button>
              </li>
              <li>
                <button data-dom-id="settings-tab-advanced" data-tab="advanced" data-slot="settings-tab" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
                  <i data-lucide="sliders-horizontal" class="h-4 w-4 shrink-0"></i>
                  <span>高级</span>
                </button>
              </li>
              <li>
                <button data-dom-id="settings-tab-about" data-tab="about" data-slot="settings-tab" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-foreground hover:bg-accent hover:text-accent-foreground data-[active=true]:bg-primary data-[active=true]:text-primary-foreground">
                  <i data-lucide="info" class="h-4 w-4 shrink-0"></i>
                  <span>关于</span>
                </button>
              </li>
            </ul>
          </nav>
          <div class="border-t border-border p-3">
            <button data-dom-id="btn-back-to-browser" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-body text-muted-foreground hover:bg-accent hover:text-accent-foreground">
              <i data-lucide="arrow-left" class="h-4 w-4 shrink-0"></i>
              <span>返回浏览器</span>
            </button>
          </div>
        </aside>

        <!-- Settings form area -->
        <div class="flex min-w-0 flex-1 flex-col bg-background">
          <div class="flex h-11 shrink-0 items-center border-b border-border bg-toolbar px-4">
            <span data-slot="settings-tab" class="text-heading">IDE 管理</span>
          </div>
          <main data-region="settings-form" data-slot="settings-form" class="flex-1 overflow-y-auto p-6">
            <section class="mx-auto max-w-2xl space-y-6">
              <div>
                <h2 class="text-heading font-semibold text-foreground">已配置的 IDE</h2>
                <p class="mt-1 text-body text-muted-foreground">管理 IDE 工作目录扫描路径，启用或禁用对应的 IDE 入口。</p>
              </div>

              <div class="space-y-3">
                <!-- Codex -->
                <div class="flex items-center gap-3 rounded-lg border border-border bg-card p-3">
                  <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md bg-secondary">
                    <i data-lucide="box" class="h-5 w-5 text-primary"></i>
                  </div>
                  <div class="min-w-0 flex-1 space-y-1">
                    <label for="ide-path-codex" class="block text-body font-medium text-foreground">Codex</label>
                    <input id="ide-path-codex" type="text" value="~/.codex" class="w-full rounded-md border border-input bg-background px-2.5 py-1.5 text-body text-foreground outline-none focus:border-ring focus:ring-1 focus:ring-ring" />
                  </div>
                  <label class="inline-flex cursor-pointer items-center gap-2">
                    <input type="checkbox" checked class="sr-only peer" />
                    <span class="relative h-5 w-9 rounded-full bg-input transition peer-checked:bg-primary after:absolute after:left-0.5 after:top-0.5 after:h-4 after:w-4 after:rounded-full after:bg-background after:transition peer-checked:after:translate-x-4"></span>
                    <span class="text-caption text-muted-foreground">启用</span>
                  </label>
                  <button type="button" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-muted-foreground hover:bg-destructive/10 hover:text-destructive" aria-label="移除 Codex">
                    <i data-lucide="trash-2" class="h-4 w-4"></i>
                  </button>
                </div>

                <!-- Claude Code -->
                <div class="flex items-center gap-3 rounded-lg border border-border bg-card p-3">
                  <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md bg-secondary">
                    <i data-lucide="message-square" class="h-5 w-5 text-primary"></i>
                  </div>
                  <div class="min-w-0 flex-1 space-y-1">
                    <label for="ide-path-claude" class="block text-body font-medium text-foreground">Claude Code</label>
                    <input id="ide-path-claude" type="text" value="~/.claude-code" class="w-full rounded-md border border-input bg-background px-2.5 py-1.5 text-body text-foreground outline-none focus:border-ring focus:ring-1 focus:ring-ring" />
                  </div>
                  <label class="inline-flex cursor-pointer items-center gap-2">
                    <input type="checkbox" checked class="sr-only peer" />
                    <span class="relative h-5 w-9 rounded-full bg-input transition peer-checked:bg-primary after:absolute after:left-0.5 after:top-0.5 after:h-4 after:w-4 after:rounded-full after:bg-background after:transition peer-checked:after:translate-x-4"></span>
                    <span class="text-caption text-muted-foreground">启用</span>
                  </label>
                  <button type="button" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-muted-foreground hover:bg-destructive/10 hover:text-destructive" aria-label="移除 Claude Code">
                    <i data-lucide="trash-2" class="h-4 w-4"></i>
                  </button>
                </div>

                <!-- Trae -->
                <div class="flex items-center gap-3 rounded-lg border border-border bg-card p-3">
                  <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md bg-secondary">
                    <i data-lucide="zap" class="h-5 w-5 text-primary"></i>
                  </div>
                  <div class="min-w-0 flex-1 space-y-1">
                    <label for="ide-path-trae" class="block text-body font-medium text-foreground">Trae</label>
                    <input id="ide-path-trae" type="text" value="~/.trae" class="w-full rounded-md border border-input bg-background px-2.5 py-1.5 text-body text-foreground outline-none focus:border-ring focus:ring-1 focus:ring-ring" />
                  </div>
                  <label class="inline-flex cursor-pointer items-center gap-2">
                    <input type="checkbox" checked class="sr-only peer" />
                    <span class="relative h-5 w-9 rounded-full bg-input transition peer-checked:bg-primary after:absolute after:left-0.5 after:top-0.5 after:h-4 after:w-4 after:rounded-full after:bg-background after:transition peer-checked:after:translate-x-4"></span>
                    <span class="text-caption text-muted-foreground">启用</span>
                  </label>
                  <button type="button" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-muted-foreground hover:bg-destructive/10 hover:text-destructive" aria-label="移除 Trae">
                    <i data-lucide="trash-2" class="h-4 w-4"></i>
                  </button>
                </div>

                <!-- Cursor -->
                <div class="flex items-center gap-3 rounded-lg border border-border bg-card p-3">
                  <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md bg-secondary">
                    <i data-lucide="sparkles" class="h-5 w-5 text-primary"></i>
                  </div>
                  <div class="min-w-0 flex-1 space-y-1">
                    <label for="ide-path-cursor" class="block text-body font-medium text-foreground">Cursor</label>
                    <input id="ide-path-cursor" type="text" value="~/.cursor" class="w-full rounded-md border border-input bg-background px-2.5 py-1.5 text-body text-foreground outline-none focus:border-ring focus:ring-1 focus:ring-ring" />
                  </div>
                  <label class="inline-flex cursor-pointer items-center gap-2">
                    <input type="checkbox" checked class="sr-only peer" />
                    <span class="relative h-5 w-9 rounded-full bg-input transition peer-checked:bg-primary after:absolute after:left-0.5 after:top-0.5 after:h-4 after:w-4 after:rounded-full after:bg-background after:transition peer-checked:after:translate-x-4"></span>
                    <span class="text-caption text-muted-foreground">启用</span>
                  </label>
                  <button type="button" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-muted-foreground hover:bg-destructive/10 hover:text-destructive" aria-label="移除 Cursor">
                    <i data-lucide="trash-2" class="h-4 w-4"></i>
                  </button>
                </div>

                <!-- Zed -->
                <div class="flex items-center gap-3 rounded-lg border border-border bg-card p-3">
                  <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md bg-secondary">
                    <i data-lucide="bolt" class="h-5 w-5 text-primary"></i>
                  </div>
                  <div class="min-w-0 flex-1 space-y-1">
                    <label for="ide-path-zed" class="block text-body font-medium text-foreground">Zed</label>
                    <input id="ide-path-zed" type="text" value="~/.zed" class="w-full rounded-md border border-input bg-background px-2.5 py-1.5 text-body text-foreground outline-none focus:border-ring focus:ring-1 focus:ring-ring" />
                  </div>
                  <label class="inline-flex cursor-pointer items-center gap-2">
                    <input type="checkbox" checked class="sr-only peer" />
                    <span class="relative h-5 w-9 rounded-full bg-input transition peer-checked:bg-primary after:absolute after:left-0.5 after:top-0.5 after:h-4 after:w-4 after:rounded-full after:bg-background after:transition peer-checked:after:translate-x-4"></span>
                    <span class="text-caption text-muted-foreground">启用</span>
                  </label>
                  <button type="button" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-muted-foreground hover:bg-destructive/10 hover:text-destructive" aria-label="移除 Zed">
                    <i data-lucide="trash-2" class="h-4 w-4"></i>
                  </button>
                </div>

                <!-- VS Code -->
                <div class="flex items-center gap-3 rounded-lg border border-border bg-card p-3">
                  <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md bg-secondary">
                    <i data-lucide="braces" class="h-5 w-5 text-primary"></i>
                  </div>
                  <div class="min-w-0 flex-1 space-y-1">
                    <label for="ide-path-vscode" class="block text-body font-medium text-foreground">VS Code</label>
                    <input id="ide-path-vscode" type="text" value="~/.vscode" class="w-full rounded-md border border-input bg-background px-2.5 py-1.5 text-body text-foreground outline-none focus:border-ring focus:ring-1 focus:ring-ring" />
                  </div>
                  <label class="inline-flex cursor-pointer items-center gap-2">
                    <input type="checkbox" checked class="sr-only peer" />
                    <span class="relative h-5 w-9 rounded-full bg-input transition peer-checked:bg-primary after:absolute after:left-0.5 after:top-0.5 after:h-4 after:w-4 after:rounded-full after:bg-background after:transition peer-checked:after:translate-x-4"></span>
                    <span class="text-caption text-muted-foreground">启用</span>
                  </label>
                  <button type="button" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-muted-foreground hover:bg-destructive/10 hover:text-destructive" aria-label="移除 VS Code">
                    <i data-lucide="trash-2" class="h-4 w-4"></i>
                  </button>
                </div>
              </div>

              <div class="flex items-center justify-between rounded-lg border border-border bg-card p-3">
                <div>
                  <label for="default-ide" class="block text-body font-medium text-foreground">默认 IDE</label>
                  <p class="text-caption text-muted-foreground">启动时默认选中的 IDE 工作目录。</p>
                </div>
                <select id="default-ide" class="rounded-md border border-input bg-background px-3 py-1.5 text-body text-foreground outline-none focus:border-ring focus:ring-1 focus:ring-ring">
                  <option value="codex" selected>Codex</option>
                  <option value="claude">Claude Code</option>
                  <option value="cursor">Cursor</option>
                  <option value="zed">Zed</option>
                  <option value="trae">Trae</option>
                  <option value="vscode">VS Code</option>
                </select>
              </div>

              <div class="flex items-center gap-2">
                <button type="button" class="inline-flex items-center gap-1.5 rounded-md bg-primary px-3 py-1.5 text-body font-medium text-primary-foreground hover:bg-primary/90">
                  <i data-lucide="plus" class="h-4 w-4"></i>
                  <span>添加 IDE</span>
                </button>
                <button type="button" class="inline-flex items-center gap-1.5 rounded-md border border-border bg-background px-3 py-1.5 text-body text-foreground hover:bg-secondary">
                  <i data-lucide="rotate-ccw" class="h-4 w-4"></i>
                  <span>恢复默认</span>
                </button>
              </div>
            </section>
          </main>
        </div>
      </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
